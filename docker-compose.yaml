version: "3.9"

services:
  app:
    build: .
    container_name: hafidz_track_api
    ports:
      - "${PORT}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES: ${JWT_EXPIRES}
      PORT: ${PORT}
    depends_on:
      - db
    command: >
      sh -c "
      npx prisma migrate deploy &&
      npx prisma db seed &&
      npm run start:prod
      "

  db:
    image: postgres:14-alpine
    container_name: hafidz_track_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nestdb
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pg_data:
